server:
  port: 8021

spring:
  application:
    name: reporting-service
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  main:
    allow-bean-definition-overriding: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    ui-url: ${RABBITMQ_UI_URL:http://localhost:15672}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  # Schema scripts live in db/migration but are applied manually: Flyway stays disabled on purpose.
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false

eureka:
  client:
    # Service discovery is opt-in: set EUREKA_CLIENT_ENABLED=true (and EUREKA_URL) to register.
    enabled: ${EUREKA_CLIENT_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  # Every log line carries the correlation id set by RequestCorrelationFilter (MDC key: requestId).
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.sample.system: ${LOG_LEVEL_APP:INFO}

application:
  version: 1.0.0

reporting:
  security:
    enabled: ${REPORTING_SECURITY_ENABLED:true}
    jwk-set-uri: ${REPORTING_JWT_JWK_SET_URI:}
    issuer-uri: ${REPORTING_JWT_ISSUER_URI:}
    hmac-secret: ${REPORTING_JWT_HMAC_SECRET:}
    roles-claim: ${REPORTING_JWT_ROLES_CLAIM:roles}
  api:
    public-base-url: ${REPORTING_PUBLIC_BASE_URL:http://localhost:8021}
  rabbitmq:
    retry:
      max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
      delay-ms: ${RABBITMQ_RETRY_DELAY_MS:30000}
    exchange: banking.integration.events
    dead-letter-exchange: banking.integration.dlx
    queues:
      party: reporting.party.events
      card: reporting.card.events
      loan: reporting.loan.events
      accounting: reporting.accounting.events
      product: reporting.product.events
    routing-keys:
      party: party.events
      card: card.events
      loan: loan.events
      accounting: accounting.events
      product: product.events
  scheduler:
    fixed-delay-ms: ${REPORTING_SCHEDULER_DELAY_MS:60000}
  file-cleanup:
    # Removes leftover staged files; objects in S3 expire through the bucket lifecycle rule.
    retention-days: ${REPORTING_FILE_RETENTION_DAYS:2}
    cron: "0 0 0 * * *"
    zone: ${REPORTING_CLEANUP_ZONE:Asia/Tehran}
  batch:
    chunk-size: 1000
  storage:
    # s3 (default, any S3-compatible store) | local (development/tests only: not shared between instances)
    type: ${REPORTING_STORAGE_TYPE:s3}
    # Staging directory: reports are generated here, then uploaded to the bucket and removed.
    local-path: ${REPORTING_STAGING_PATH:report-output}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET:reporting-service}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      create-bucket-if-missing: ${S3_CREATE_BUCKET:true}
      server-side-encryption: ${S3_SSE_ENABLED:false}
      retention-days: ${REPORTING_FILE_RETENTION_DAYS:2}

---
# Activate with SPRING_PROFILES_ACTIVE=...,json to emit structured (ECS) JSON logs on stdout
# for Filebeat/Logstash/Fluent Bit -> Elasticsearch (ELK).
spring:
  config:
    activate:
      on-profile: json
logging:
  structured:
    format:
      console: ecs
